name: verify
on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: mkdir -p .ci-results
      - name: Unit and regression tests
        run: npm test | tee .ci-results/unit-tests.txt
      - name: Standalone route checks
        run: node --experimental-strip-types tools/drive-course.ts | tee .ci-results/routes.json
      - name: Two-car race checks
        run: node --experimental-strip-types tools/check-race.ts | tee .ci-results/race.json
      - name: Production build
        run: npm run build
      - name: Package playable build
        run: python3 scripts/package_build.py
      - uses: actions/upload-artifact@v7
        with:
          name: streak-${{ github.sha }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 30
